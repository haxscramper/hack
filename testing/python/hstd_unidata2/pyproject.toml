[project]
name = "hstd-unidata"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beartype",
    "loguru",
    "plumbum",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src/hstd_unidata"]
testpaths = ["tests"]
