[project]
name = "hstd-unidata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "haxscramper", email = "haxscramper@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.23.1",
    "loguru>=0.7.3",
    "plumbum>=2.0.2",
    "pydantic>=2.14.1",
]

[project.scripts]
hstd-unidata = "hstd_unidata:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = [
  "F405",
  "F403",
  "E501",
  "F841",
  "F522",
  "F401",
  "E712",
  "C408",
  "B008",
  "RUF012",
  "RUF009",
  "UP035",
  "PYI029", # defining `__repr__` in stub
  "FLY002", # do not flag `"\n".join(["literal", "literal"])`
  "UP032", # do not flag `format()`
  "DTZ006",
  "UP045",
  "SIM117", # combine `with`
]
