devices:
  - type: "streamdeck"
    model: "Stream Deck Neo"
    id: neo-1
    layers:
      - name: "Page 5"
        buttons:
          0:
            title_text:
              text: "-120"
              font_size: 36
            action:
              type: "execute_script"
              script: "playerctl_wrap.py --window firefox rel-position -120"
          1:
            title_text:
              text: "+120"
              font_size: 36
            action:
              type: "execute_script"
              script: "playerctl_wrap.py --window firefox rel-position +120"
          2:
            title_text:
              text: "+300"
              font_size: 36
            action:
              type: "execute_script"
              script: "playerctl_wrap.py --window firefox rel-position +300"
          3:
            title_text:
              text: "X clang++"
              font_size: 36
            action:
              type: "execute_script"
              script: "killall clang"
          4:
            title_text:
              text: "=/>>"
              font_size: 36
            action:
              type: "execute_script"
              script: "playerctl_wrap.py --window firefox play-pause"
          5:
            title_text:
              text: "<"
              font_size: 48
            action:
              type: "execute_script"
              script: "playerctl_wrap.py --window firefox previous"
          6:
            title_text:
              text: ">"
              font_size: 48
            action:
              type: "execute_script"
              script: "playerctl_wrap.py --window firefox next"
          9:
             action:
              type: "change_page"
              direction: "forward"
          8:
             action:
              type: "change_page"
              direction: "backward"
      - name: "Page 2"
        buttons:
          0:
            title_text:
              text: "Move 1"
              font_size: 28
            action:
              type: "emulate_shortcut"
              shortcut: "ctrl+1"
          1:
            title_text:
              text: "Move 2"
              font_size: 28
            action:
              type: "emulate_shortcut"
              shortcut: "ctrl+2"
          2:
            title_text:
              text: "Move 3"
              font_size: 28
            action:
              type: "emulate_shortcut"
              shortcut: "ctrl+3"
          3:
            title_text:
              text: "Move 4"
              font_size: 28
            action:
              type: "emulate_shortcut"
              shortcut: "ctrl+4"
          4:
            title_text:
              text: "Move 5"
              font_size: 28
            action:
              type: "emulate_shortcut"
              shortcut: "ctrl+5"
          5:
            title_text:
              text: "Move 6"
              font_size: 28
            action:
              type: "emulate_shortcut"
              shortcut: "ctrl+6"
          6:
            title_text:
              text: "ESC"
              font_size: 28
            action:
              type: "emulate_shortcut"
              shortcut: "esc"
          7:
            title_text:
              text: "OK"
              font_size: 28
            action:
              type: "emulate_shortcut"
              shortcut: "enter"
          8:
             action:
              type: "change_page"
              direction: "backward"
          9:
             action:
              type: "change_page"
              direction: "forward"

      - name: "Page 3"
        buttons:
          0:
            action:
              type: "execute_script"
              script: "positional_emacs_focus.py left-upper left"
            image_path: "~/defaultdirs/images/streamdeck/split_left_upper_left.png"
          1:
            action:
              type: "execute_script"
              script: "positional_emacs_focus.py left-upper right"
            image_path: "~/defaultdirs/images/streamdeck/split_left_upper_right.png"
          4:
            action:
              type: "execute_script"
              script: "positional_emacs_focus.py left-lower left"
            image_path: "~/defaultdirs/images/streamdeck/split_left_lower_left.png"
          5:
            action:
              type: "execute_script"
              script: "positional_emacs_focus.py left-lower right"
            image_path: "~/defaultdirs/images/streamdeck/split_left_lower_right.png"
          6:
            action:
              type: "execute_script"
              script: "positional_emacs_focus.py right left"
            image_path: "~/defaultdirs/images/streamdeck/split_right_left.png"
          7:
            action:
              type: "execute_script"
              script: "positional_emacs_focus.py right right"
            image_path: "~/defaultdirs/images/streamdeck/split_right_right.png"

          9:
             action:
              type: "change_page"
              direction: "forward"
          8:
             action:
              type: "change_page"
              direction: "backward"
      - name: "Page 4"
        buttons:
          4:
            title_text:
              text: "WACOM"
              font_size: 28
            action:
              type: "execute_script"
              script: "fixwacom.py"
          9:
             action:
              type: "change_page"
              direction: "forward"
          8:
             action:
              type: "change_page"
              direction: "backward"


