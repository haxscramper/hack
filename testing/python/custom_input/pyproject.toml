[project]
name = "custom-input"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "haxscramper", email = "haxscramper@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "evdev>=2.0.0",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "plumbum>=2.0.2",
    "pyautogui>=0.9.54",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.19.1",
    "streamdeck>=0.10.0",
]

[project.scripts]
custom-input = "custom_input:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"
